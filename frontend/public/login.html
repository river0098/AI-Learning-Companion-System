<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI陪伴学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .left-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 1.1em;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .features {
            list-style: none;
            margin-top: 30px;
        }

        .features li {
            margin: 15px 0;
            padding-left: 30px;
            position: relative;
        }

        .features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            background: rgba(255,255,255,0.2);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .right-panel {
            padding: 60px 40px;
        }

        .form-container {
            max-width: 350px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1.1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .left-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>🎓 AI陪伴学习</h1>
            <p>将传统监督转变为智能陪伴<br>用同理心赋能学习</p>

            <ul class="features">
                <li>智能视觉分析，了解学习状态</li>
                <li>情感AI伙伴，三种模式陪伴</li>
                <li>知识图谱追踪，个性化学习路径</li>
                <li>隐私优先设计，数据安全可靠</li>
            </ul>
        </div>

        <div class="right-panel">
            <div class="form-container">
                <!-- 标签切换 -->
                <div class="tabs">
                    <div class="tab active" onclick="showTab('login')">登录</div>
                    <div class="tab" onclick="showTab('register')">注册</div>
                </div>

                <!-- 错误/成功消息 -->
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <!-- 登录表单 -->
                <div class="form active" id="loginForm">
                    <h2 style="margin-bottom: 30px; color: #333;">欢迎回来</h2>

                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" placeholder="请输入密码" required>
                    </div>

                    <button class="btn" onclick="handleLogin()">登录</button>
                </div>

                <!-- 注册表单 -->
                <div class="form" id="registerForm">
                    <h2 style="margin-bottom: 30px; color: #333;">创建账户</h2>

                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="registerUsername" placeholder="请输入用户名" required>
                    </div>

                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="registerEmail" placeholder="请输入邮箱" required>
                    </div>

                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="registerPassword" placeholder="请输入密码（至少6位）" required>
                    </div>

                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="registerPasswordConfirm" placeholder="请再次输入密码" required>
                    </div>

                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="registerFullName" placeholder="请输入真实姓名">
                    </div>

                    <div class="form-group">
                        <label>用户类型</label>
                        <select id="registerUserType">
                            <option value="student">学生</option>
                            <option value="parent">家长</option>
                        </select>
                    </div>

                    <button class="btn" onclick="handleRegister()">注册</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 切换标签
        function showTab(tab) {
            // 更新标签样式
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // 更新表单显示
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.getElementById(tab + 'Form').classList.add('active');

            // 清除消息
            hideMessages();
        }

        // 显示错误消息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        // 显示成功消息
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // 隐藏消息
        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // 处理登录
        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('请填写所有字段');
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    // 保存令牌
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('user', JSON.stringify(result.data));

                    showSuccess('登录成功！正在跳转...');

                    // 根据用户类型跳转
                    setTimeout(() => {
                        if (result.data.user_type === 'student') {
                            window.location.href = '/student';
                        } else if (result.data.user_type === 'parent') {
                            window.location.href = '/parent';
                        }
                    }, 1000);
                } else {
                    showError(result.detail || '登录失败');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('连接服务器失败，请确保后端正在运行');
            }
        }

        // 处理注册
        async function handleRegister() {
            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const fullName = document.getElementById('registerFullName').value.trim();
            const userType = document.getElementById('registerUserType').value;

            // 验证
            if (!username || !email || !password) {
                showError('请填写所有必填字段');
                return;
            }

            if (password.length < 6) {
                showError('密码至少需要6个字符');
                return;
            }

            if (password !== passwordConfirm) {
                showError('两次输入的密码不一致');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        full_name: fullName,
                        user_type: userType
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // 保存令牌
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('user', JSON.stringify(result.data));

                    showSuccess('注册成功！正在跳转...');

                    // 根据用户类型跳转
                    setTimeout(() => {
                        if (result.data.user_type === 'student') {
                            window.location.href = '/student';
                        } else if (result.data.user_type === 'parent') {
                            window.location.href = '/parent';
                        }
                    }, 1000);
                } else {
                    showError(result.detail || '注册失败');
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('连接服务器失败，请确保后端正在运行');
            }
        }

        // 回车提交
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            document.getElementById('registerPasswordConfirm').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleRegister();
            });
        });

        // 检查是否已登录
        window.onload = () => {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (token && user.user_type) {
                // 已登录，直接跳转
                if (user.user_type === 'student') {
                    window.location.href = '/student';
                } else if (user.user_type === 'parent') {
                    window.location.href = '/parent';
                }
            }
        };
    </script>
</body>
</html>
