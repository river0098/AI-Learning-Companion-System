<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI陪伴学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-indicator.active {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-indicator.inactive {
            background: #94a3b8;
        }

        /* 登录区域 */
        .login-section {
            text-align: center;
        }

        .login-section input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #4ade80;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* AI聊天区域 */
        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f9fafb;
        }

        .chat-message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
        }

        .chat-message.student {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .chat-message.ai {
            background: #e0e7ff;
            color: #333;
        }

        .chat-message .sender {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .mode-selector {
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 8px 16px;
            margin-right: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 仪表板 */
        .dashboard-item {
            padding: 15px;
            margin: 10px 0;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .dashboard-item .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .dashboard-item .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s;
        }

        /* 隐藏/显示元素 */
        .hidden {
            display: none !important;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🎓 AI陪伴学习系统</h1>
            <p>将监督转变为智能陪伴 · 用同理心赋能学习</p>
        </div>

        <!-- 登录区域 -->
        <div id="loginSection" class="card">
            <h2>开始学习</h2>
            <div class="login-section">
                <input type="text" id="studentId" placeholder="请输入学生ID (例如: student_001)">
                <input type="text" id="studentName" placeholder="请输入学生姓名 (可选)">
                <button class="btn btn-primary" onclick="startSession()">开始学习会话</button>
            </div>
        </div>

        <!-- 主要内容区域 -->
        <div id="mainContent" class="hidden">
            <div class="main-content">
                <!-- 左侧：AI伙伴聊天 -->
                <div class="card">
                    <h2>
                        <span class="status-indicator active"></span>
                        AI学习伙伴
                    </h2>

                    <!-- 模式选择 -->
                    <div class="mode-selector">
                        <button class="mode-btn" onclick="setMode('guide')">🎓 导师模式</button>
                        <button class="mode-btn active" onclick="setMode('coach')">💪 教练模式</button>
                        <button class="mode-btn" onclick="setMode('friend')">🤗 朋友模式</button>
                    </div>

                    <!-- 聊天区域 -->
                    <div class="chat-container" id="chatContainer">
                        <div class="chat-message ai">
                            <div class="sender">AI伙伴</div>
                            <div class="content">你好！我是你的学习伙伴，准备开始学习了吗？有任何问题都可以问我！</div>
                        </div>
                    </div>

                    <!-- 输入区域 -->
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="输入你的消息..." onkeypress="handleKeyPress(event)">
                        <button class="btn btn-primary" onclick="sendMessage()">发送</button>
                    </div>
                </div>

                <!-- 右侧：学生仪表板 -->
                <div class="card">
                    <h2>📊 学习仪表板</h2>
                    <div id="studentDashboard" class="loading">加载中</div>
                </div>
            </div>

            <!-- 底部：控制面板 -->
            <div class="card">
                <h2>⚙️ 控制面板</h2>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <div style="flex: 1;">
                        <p><strong>当前学生：</strong> <span id="currentStudent">-</span></p>
                        <p><strong>会话状态：</strong> <span id="sessionStatus">活跃</span></p>
                    </div>
                    <button class="btn btn-danger" onclick="endSession()">结束会话</button>
                    <button class="btn btn-success" onclick="refreshDashboard()">刷新数据</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentStudentId = null;
        let currentMode = 'coach';
        let ws = null;

        // 开始会话
        async function startSession() {
            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();

            if (!studentId) {
                alert('请输入学生ID');
                return;
            }

            try {
                const response = await fetch('/api/session/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_id: studentId, student_name: studentName })
                });

                const result = await response.json();

                if (result.success) {
                    currentStudentId = studentId;
                    document.getElementById('currentStudent').textContent = studentName || studentId;
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');

                    // 连接WebSocket
                    connectWebSocket(studentId);

                    // 加载仪表板
                    loadStudentDashboard();

                    addAIMessage('会话已开始！让我们一起学习吧！');
                } else {
                    alert('开始会话失败');
                }
            } catch (error) {
                console.error('错误:', error);
                alert('连接服务器失败，请确保后端服务正在运行');
            }
        }

        // 结束会话
        async function endSession() {
            if (!confirm('确定要结束本次学习会话吗？')) {
                return;
            }

            try {
                const response = await fetch(`/api/session/end?student_id=${currentStudentId}`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (result.success) {
                    const summary = result.data;
                    const minutes = Math.floor(summary.focused_time / 60);

                    addAIMessage(`会话结束！本次学习专注时间：${minutes}分钟。做得很好！`);

                    setTimeout(() => {
                        location.reload();
                    }, 2000);
                }
            } catch (error) {
                console.error('错误:', error);
            }
        }

        // 设置AI模式
        function setMode(mode) {
            currentMode = mode;

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            const modeNames = {
                'guide': '导师模式',
                'coach': '教练模式',
                'friend': '朋友模式'
            };

            addAIMessage(`已切换到${modeNames[mode]}，我会用不同的方式陪伴你学习！`);
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // 显示学生消息
            addStudentMessage(message);
            input.value = '';

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        student_id: currentStudentId,
                        message: message,
                        mode: currentMode
                    })
                });

                const result = await response.json();

                if (result.success) {
                    addAIMessage(result.data.ai_message);

                    // 显示快捷回复（如果有）
                    if (result.data.suggested_responses && result.data.suggested_responses.length > 0) {
                        addQuickReplies(result.data.suggested_responses);
                    }
                }
            } catch (error) {
                console.error('错误:', error);
                addAIMessage('抱歉，我遇到了一些问题。请稍后再试。');
            }
        }

        // 添加AI消息
        function addAIMessage(message) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message ai';
            messageDiv.innerHTML = `
                <div class="sender">AI伙伴</div>
                <div class="content">${message}</div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 添加学生消息
        function addStudentMessage(message) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message student';
            messageDiv.innerHTML = `
                <div class="sender">我</div>
                <div class="content">${message}</div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 添加快捷回复
        function addQuickReplies(replies) {
            const chatContainer = document.getElementById('chatContainer');
            const repliesDiv = document.createElement('div');
            repliesDiv.style.marginTop = '10px';

            replies.forEach(reply => {
                const btn = document.createElement('button');
                btn.className = 'mode-btn';
                btn.textContent = reply;
                btn.onclick = () => {
                    document.getElementById('messageInput').value = reply;
                    sendMessage();
                };
                repliesDiv.appendChild(btn);
            });

            chatContainer.appendChild(repliesDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 加载学生仪表板
        async function loadStudentDashboard() {
            try {
                const response = await fetch(`/api/dashboard/student/${currentStudentId}`);
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    const dashboardDiv = document.getElementById('studentDashboard');

                    dashboardDiv.innerHTML = `
                        <div class="dashboard-item">
                            <div class="label">今日学习时间</div>
                            <div class="value">${data.today_minutes || 0} 分钟</div>
                        </div>
                        <div class="dashboard-item">
                            <div class="label">本周学习时间</div>
                            <div class="value">${data.week_minutes || 0} 分钟</div>
                        </div>
                        <div class="dashboard-item">
                            <div class="label">连续打卡</div>
                            <div class="value">${data.streak || 0} 天 🔥</div>
                        </div>
                        <div class="dashboard-item">
                            <div class="label">掌握的主题</div>
                            <div class="value">${data.topics_mastered || 0} 个</div>
                        </div>
                        <div class="dashboard-item">
                            <div class="label">近期成就</div>
                            <div class="value">${data.achievements && data.achievements.length > 0 ? data.achievements.join(', ') : '继续加油！'}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载仪表板失败:', error);
            }
        }

        // 刷新仪表板
        function refreshDashboard() {
            loadStudentDashboard();
            addAIMessage('数据已刷新！');
        }

        // 连接WebSocket
        function connectWebSocket(studentId) {
            ws = new WebSocket(`ws://${window.location.host}/ws/${studentId}`);

            ws.onopen = () => {
                console.log('WebSocket已连接');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'ai_response') {
                    addAIMessage(data.data.ai_message);
                } else if (data.type === 'session_ended') {
                    addAIMessage('会话已结束');
                }
            };

            ws.onclose = () => {
                console.log('WebSocket已断开');
            };
        }

        // 回车发送
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 检查服务器状态
        async function checkServerStatus() {
            try {
                const response = await fetch('/api/status');
                const result = await response.json();
                console.log('服务器状态:', result);
            } catch (error) {
                console.error('无法连接到服务器');
            }
        }

        // 页面加载时检查服务器
        window.onload = () => {
            checkServerStatus();
        };
    </script>
</body>
</html>
