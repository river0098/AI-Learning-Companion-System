<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号设置 - AI陪伴学习系统</title>
    <link rel="stylesheet" href="styles/design-system-enhanced.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .page-header {
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--primary-start);
            text-decoration: none;
            transition: all 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--primary-end);
        }

        .page-title {
            font-size: 36px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
        }

        /* 侧边栏导航 */
        .sidebar {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-item:hover {
            background: var(--gray-100);
        }

        .nav-item.active {
            background: var(--primary-gradient);
            color: white;
        }

        .nav-icon {
            font-size: 20px;
        }

        /* 主内容区 */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 账号卡片 */
        .account-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
        }

        .account-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .section-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .account-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border-light);
            transition: all 0.3s;
        }

        .account-item:hover {
            border-color: var(--primary-start);
            background: rgba(102, 126, 234, 0.02);
        }

        .account-item.linked {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.03);
        }

        .account-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .account-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--primary-gradient);
            color: white;
        }

        .account-icon.phone {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .account-icon.email {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .account-icon.wechat {
            background: linear-gradient(135deg, #07c160 0%, #4cd964 100%);
        }

        .account-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .account-value {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .account-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-linked {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status-unlinked {
            background: rgba(156, 163, 175, 0.15);
            color: var(--gray-500);
        }

        /* 安全分数卡片 */
        .security-score-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .score-circle {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
        }

        .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .recommendations {
            text-align: left;
        }

        .recommendation-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            background: var(--gray-50);
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .recommendation-icon {
            flex-shrink: 0;
            font-size: 16px;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-2xl);
            max-width: 480px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 28px 32px;
            border-bottom: 1px solid var(--border-light);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-body {
            padding: 32px;
        }

        .modal-footer {
            padding: 20px 32px;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* 响应式 */
        @media (max-width: 968px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                display: flex;
                overflow-x: auto;
                padding: 16px;
                gap: 8px;
            }

            .nav-item {
                white-space: nowrap;
                margin: 0;
            }

            .page-title {
                font-size: 28px;
            }

            .account-card {
                padding: 24px 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
            }

            .account-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .account-right {
                width: 100%;
                justify-content: space-between;
            }
        }

        /* Toast消息 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }

        .toast.show {
            display: flex;
        }

        .toast-success {
            border-left: 4px solid var(--success);
        }

        .toast-error {
            border-left: 4px solid var(--error);
        }

        .toast-icon {
            font-size: 20px;
        }

        .toast-message {
            font-size: 15px;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <!-- 页面头部 -->
    <div class="page-header">
        <div class="breadcrumb">
            <a href="/student">主页</a>
            <span>›</span>
            <span>账号设置</span>
        </div>
        <h1 class="page-title">账号设置</h1>
        <p class="page-subtitle">管理您的登录方式和账号安全</p>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <div class="settings-grid">
            <!-- 侧边栏导航 -->
            <div class="sidebar">
                <div class="nav-item active">
                    <span class="nav-icon">🔐</span>
                    <span>登录方式</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">🛡️</span>
                    <span>安全设置</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span>登录历史</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span>偏好设置</span>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="content-area">
                <!-- 安全分数卡片 -->
                <div class="security-score-card">
                    <h2 class="section-title">账号安全分数</h2>
                    <div class="score-circle">
                        <svg width="160" height="160" viewBox="0 0 160 160">
                            <circle cx="80" cy="80" r="70" fill="none" stroke="#e5e7eb" stroke-width="12"/>
                            <circle id="scoreCircle" cx="80" cy="80" r="70" fill="none" stroke="url(#gradient)"
                                    stroke-width="12" stroke-linecap="round"
                                    stroke-dasharray="440" stroke-dashoffset="440"
                                    transform="rotate(-90 80 80)"/>
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" style="stop-color:#667eea"/>
                                    <stop offset="100%" style="stop-color:#764ba2"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="score-value" id="scoreValue">--</div>
                    </div>
                    <p class="score-label">您的账号安全性<span id="scoreLevel">良好</span></p>

                    <div class="recommendations" id="recommendations">
                        <!-- 动态加载建议 -->
                    </div>
                </div>

                <!-- 已关联账号 -->
                <div class="account-card">
                    <h2 class="section-title">已关联账号</h2>
                    <p class="section-desc">绑定多种登录方式，让登录更便捷</p>

                    <div class="accounts-list">
                        <!-- 手机号 -->
                        <div class="account-item" id="phoneAccount">
                            <div class="account-left">
                                <div class="account-icon phone">📱</div>
                                <div class="account-info">
                                    <h3>手机号</h3>
                                    <p class="account-value" id="phoneValue">未绑定</p>
                                </div>
                            </div>
                            <div class="account-right">
                                <span class="status-badge status-unlinked" id="phoneStatus">未绑定</span>
                                <button class="btn btn-primary btn-sm" id="phoneBindBtn" onclick="showBindPhone()">绑定</button>
                                <button class="btn btn-outline btn-sm hidden" id="phoneUnbindBtn" onclick="unbindAccount('phone')">解绑</button>
                            </div>
                        </div>

                        <!-- 邮箱 -->
                        <div class="account-item" id="emailAccount">
                            <div class="account-left">
                                <div class="account-icon email">📧</div>
                                <div class="account-info">
                                    <h3>邮箱</h3>
                                    <p class="account-value" id="emailValue">未绑定</p>
                                </div>
                            </div>
                            <div class="account-right">
                                <span class="status-badge status-unlinked" id="emailStatus">未绑定</span>
                                <button class="btn btn-primary btn-sm" id="emailBindBtn" onclick="showBindEmail()">绑定</button>
                                <button class="btn btn-outline btn-sm hidden" id="emailUnbindBtn" onclick="unbindAccount('email')">解绑</button>
                            </div>
                        </div>

                        <!-- 微信 -->
                        <div class="account-item" id="wechatAccount">
                            <div class="account-left">
                                <div class="account-icon wechat">🔐</div>
                                <div class="account-info">
                                    <h3>微信</h3>
                                    <p class="account-value" id="wechatValue">未绑定</p>
                                </div>
                            </div>
                            <div class="account-right">
                                <span class="status-badge status-unlinked" id="wechatStatus">未绑定</span>
                                <button class="btn btn-primary btn-sm" onclick="bindWechat()">绑定</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 绑定手机号模态框 -->
    <div class="modal-overlay" id="bindPhoneModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">绑定手机号</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="tel" class="form-input" id="bindPhoneNumber" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="input-group">
                        <input type="text" class="form-input" id="bindPhoneCode" placeholder="请输入验证码">
                        <button class="btn btn-secondary btn-sm" id="bindPhoneSendBtn" onclick="sendBindSMS()">获取验证码</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('bindPhoneModal')">取消</button>
                <button class="btn btn-primary" onclick="handleBindPhone()">确认绑定</button>
            </div>
        </div>
    </div>

    <!-- 绑定邮箱模态框 -->
    <div class="modal-overlay" id="bindEmailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">绑定邮箱</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">邮箱地址</label>
                    <input type="email" class="form-input" id="bindEmailAddress" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="bindEmailPassword" placeholder="设置登录密码">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('bindEmailModal')">取消</button>
                <button class="btn btn-primary" onclick="handleBindEmail()">确认绑定</button>
            </div>
        </div>
    </div>

    <!-- Toast消息 -->
    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script>
        const token = localStorage.getItem('token');
        let smsCountdown = 0;

        // 页面加载
        window.onload = () => {
            if (!token) {
                window.location.href = '/';
                return;
            }
            loadAccounts();
            loadSecurityStatus();
        };

        // 加载账号信息
        async function loadAccounts() {
            try {
                const response = await fetch('/api/auth/accounts', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                const result = await response.json();

                if (result.success) {
                    updateAccountDisplay(result.data.accounts);
                }
            } catch (error) {
                console.error('加载账号失败:', error);
            }
        }

        // 更新账号显示
        function updateAccountDisplay(accounts) {
            const types = {
                'phone': 'phone',
                'email': 'email',
                'wechat_h5': 'wechat',
                'wechat_mini': 'wechat'
            };

            // 重置显示
            Object.values(types).forEach(type => {
                const typeId = type;
                document.getElementById(`${typeId}Value`).textContent = '未绑定';
                document.getElementById(`${typeId}Status`).textContent = '未绑定';
                document.getElementById(`${typeId}Status`).className = 'status-badge status-unlinked';
                document.getElementById(`${typeId}Account`).classList.remove('linked');
            });

            // 更新已绑定的账号
            accounts.forEach(account => {
                const typeId = types[account.auth_type];
                if (!typeId) return;

                const masked = maskSensitive(account.auth_identifier, account.auth_type);
                document.getElementById(`${typeId}Value`).textContent = masked;
                document.getElementById(`${typeId}Status`).textContent = '已绑定';
                document.getElementById(`${typeId}Status`).className = 'status-badge status-linked';
                document.getElementById(`${typeId}Account`).classList.add('linked');

                // 切换按钮
                if (typeId !== 'wechat') {
                    document.getElementById(`${typeId}BindBtn`).classList.add('hidden');
                    document.getElementById(`${typeId}UnbindBtn`).classList.remove('hidden');
                }
            });
        }

        // 加载安全状态
        async function loadSecurityStatus() {
            try {
                const response = await fetch('/api/auth/security-status', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    updateSecurityScore(data.security_score);
                    updateRecommendations(data.recommendations);
                }
            } catch (error) {
                console.error('加载安全状态失败:', error);
                // 使用默认值
                updateSecurityScore(50);
                updateRecommendations(['绑定手机号以提升安全性', '绑定邮箱以便找回密码']);
            }
        }

        // 更新安全分数
        function updateSecurityScore(score) {
            const scoreEl = document.getElementById('scoreValue');
            const scoreCircle = document.getElementById('scoreCircle');
            const levelEl = document.getElementById('scoreLevel');

            // 动画显示分数
            let current = 0;
            const interval = setInterval(() => {
                if (current >= score) {
                    clearInterval(interval);
                } else {
                    current += 2;
                    scoreEl.textContent = Math.min(current, score);

                    // 更新圆环
                    const dashoffset = 440 - (440 * Math.min(current, score)) / 100;
                    scoreCircle.style.strokeDashoffset = dashoffset;
                }
            }, 20);

            // 更新等级
            if (score >= 80) {
                levelEl.textContent = '优秀';
            } else if (score >= 60) {
                levelEl.textContent = '良好';
            } else {
                levelEl.textContent = '一般';
            }
        }

        // 更新建议
        function updateRecommendations(recommendations) {
            const container = document.getElementById('recommendations');
            container.innerHTML = '';

            recommendations.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'recommendation-item';
                item.innerHTML = `
                    <span class="recommendation-icon">💡</span>
                    <span>${rec}</span>
                `;
                container.appendChild(item);
            });
        }

        // 脱敏处理
        function maskSensitive(value, type) {
            if (type === 'phone') {
                return value.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
            } else if (type === 'email') {
                const [name, domain] = value.split('@');
                if (name.length > 3) {
                    return name.substring(0, 3) + '***@' + domain;
                }
            }
            return value;
        }

        // 显示/关闭模态框
        function showBindPhone() {
            document.getElementById('bindPhoneModal').classList.add('active');
        }

        function showBindEmail() {
            document.getElementById('bindEmailModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 发送绑定验证码
        async function sendBindSMS() {
            const phone = document.getElementById('bindPhoneNumber').value.trim();

            if (!phone) {
                showToast('error', '请输入手机号');
                return;
            }

            const btn = document.getElementById('bindPhoneSendBtn');
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/sms/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone_number: phone, purpose: 'bind' })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('success', '验证码已发送');
                    startCountdown(btn);
                } else {
                    showToast('error', result.error || '发送失败');
                    btn.disabled = false;
                }
            } catch (error) {
                showToast('error', '网络错误');
                btn.disabled = false;
            }
        }

        // 倒计时
        function startCountdown(btn) {
            smsCountdown = 60;
            const interval = setInterval(() => {
                if (smsCountdown > 0) {
                    btn.textContent = `${smsCountdown}秒`;
                    smsCountdown--;
                } else {
                    btn.textContent = '获取验证码';
                    btn.disabled = false;
                    clearInterval(interval);
                }
            }, 1000);
        }

        // 绑定手机号
        async function handleBindPhone() {
            const phone = document.getElementById('bindPhoneNumber').value.trim();
            const code = document.getElementById('bindPhoneCode').value.trim();

            if (!phone || !code) {
                showToast('error', '请填写完整信息');
                return;
            }

            try {
                const response = await fetch('/api/auth/bind/phone', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ phone_number: phone, code })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('success', '绑定成功');
                    closeModal('bindPhoneModal');
                    loadAccounts();
                    loadSecurityStatus();
                } else {
                    showToast('error', result.error || '绑定失败');
                }
            } catch (error) {
                showToast('error', '网络错误');
            }
        }

        // 绑定邮箱
        async function handleBindEmail() {
            const email = document.getElementById('bindEmailAddress').value.trim();
            const password = document.getElementById('bindEmailPassword').value;

            if (!email || !password) {
                showToast('error', '请填写完整信息');
                return;
            }

            try {
                const response = await fetch('/api/auth/bind/email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('success', '绑定成功');
                    closeModal('bindEmailModal');
                    loadAccounts();
                    loadSecurityStatus();
                } else {
                    showToast('error', result.error || '绑定失败');
                }
            } catch (error) {
                showToast('error', '网络错误');
            }
        }

        // 解绑账号
        async function unbindAccount(authType) {
            if (!confirm('确定要解绑此账号吗？请确保您还有其他登录方式。')) {
                return;
            }

            try {
                const response = await fetch('/api/auth/unbind', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ auth_type: authType })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('success', '解绑成功');
                    loadAccounts();
                    loadSecurityStatus();
                } else {
                    showToast('error', result.error || '解绑失败');
                }
            } catch (error) {
                showToast('error', '网络错误');
            }
        }

        // 绑定微信
        function bindWechat() {
            showToast('error', '微信绑定需要配置，请联系管理员');
        }

        // Toast消息
        function showToast(type, message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toast.className = `toast toast-${type} show`;
            toastMessage.textContent = message;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
