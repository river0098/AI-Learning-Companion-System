<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号设置 - AI陪伴学习系统</title>
    <link rel="stylesheet" href="styles/design-system.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .account-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .account-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .account-item.linked {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .account-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .account-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .account-icon.phone {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .account-icon.email {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .account-icon.wechat {
            background: linear-gradient(135deg, #07c160 0%, #4cd964 100%);
        }

        .account-details {
            flex: 1;
        }

        .account-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .account-value {
            color: #666;
            font-size: 14px;
        }

        .account-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-linked {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-unlinked {
            background: #fef1e6;
            color: #e65100;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .message.success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
        }

        .message.show {
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/student" class="back-link">← 返回主页</a>

        <div class="header">
            <h1>账号设置</h1>
            <p>管理您的登录方式，绑定多个账号以便更方便地登录</p>
        </div>

        <div id="messageBox" class="message"></div>

        <div class="card">
            <h2>已关联账号</h2>

            <!-- 手机号 -->
            <div class="account-item" id="phoneAccount">
                <div class="account-info">
                    <div class="account-icon phone">📱</div>
                    <div class="account-details">
                        <div class="account-name">手机号</div>
                        <div class="account-value" id="phoneValue">未绑定</div>
                    </div>
                </div>
                <div>
                    <span class="account-status status-unlinked" id="phoneStatus">未绑定</span>
                    <button class="btn btn-primary" onclick="showBindPhoneModal()" id="phoneBindBtn">绑定</button>
                    <button class="btn btn-danger" onclick="unbindAccount('phone')" id="phoneUnbindBtn" style="display: none;">解绑</button>
                </div>
            </div>

            <!-- 邮箱 -->
            <div class="account-item" id="emailAccount">
                <div class="account-info">
                    <div class="account-icon email">📧</div>
                    <div class="account-details">
                        <div class="account-name">邮箱</div>
                        <div class="account-value" id="emailValue">未绑定</div>
                    </div>
                </div>
                <div>
                    <span class="account-status status-unlinked" id="emailStatus">未绑定</span>
                    <button class="btn btn-primary" onclick="showBindEmailModal()" id="emailBindBtn">绑定</button>
                    <button class="btn btn-danger" onclick="unbindAccount('email')" id="emailUnbindBtn" style="display: none;">解绑</button>
                </div>
            </div>

            <!-- 微信H5 -->
            <div class="account-item" id="wechatH5Account">
                <div class="account-info">
                    <div class="account-icon wechat">🔐</div>
                    <div class="account-details">
                        <div class="account-name">微信网页</div>
                        <div class="account-value" id="wechatH5Value">未绑定</div>
                    </div>
                </div>
                <div>
                    <span class="account-status status-unlinked" id="wechatH5Status">未绑定</span>
                    <button class="btn btn-primary" onclick="bindWeChatH5()" id="wechatH5BindBtn">绑定</button>
                    <button class="btn btn-danger" onclick="unbindAccount('wechat_h5')" id="wechatH5UnbindBtn" style="display: none;">解绑</button>
                </div>
            </div>

            <!-- 微信小程序 -->
            <div class="account-item" id="wechatMiniAccount">
                <div class="account-info">
                    <div class="account-icon wechat">📱</div>
                    <div class="account-details">
                        <div class="account-name">微信小程序</div>
                        <div class="account-value" id="wechatMiniValue">未绑定</div>
                    </div>
                </div>
                <div>
                    <span class="account-status status-unlinked" id="wechatMiniStatus">未绑定</span>
                    <button class="btn btn-primary" onclick="bindWeChatMini()" id="wechatMiniBindBtn">绑定</button>
                    <button class="btn btn-danger" onclick="unbindAccount('wechat_mini')" id="wechatMiniUnbindBtn" style="display: none;">解绑</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>安全提示</h2>
            <ul style="color: #666; line-height: 1.8; padding-left: 20px;">
                <li>建议至少绑定两种登录方式，避免无法登录</li>
                <li>解绑账号前请确保还有其他可用的登录方式</li>
                <li>绑定手机号后可以使用验证码快速登录</li>
                <li>微信登录需要联系管理员配置</li>
            </ul>
        </div>
    </div>

    <!-- 绑定手机号弹窗 -->
    <div id="bindPhoneModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>绑定手机号</h3>
            </div>

            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="bindPhoneNumber" placeholder="请输入手机号">
            </div>

            <div class="form-group">
                <label>验证码</label>
                <div class="input-group">
                    <input type="text" id="bindPhoneCode" placeholder="请输入验证码">
                    <button class="btn btn-primary" onclick="sendBindSMS()" id="bindPhoneSendBtn">发送验证码</button>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn" onclick="closeModal('bindPhoneModal')">取消</button>
                <button class="btn btn-primary" onclick="handleBindPhone()">确认绑定</button>
            </div>
        </div>
    </div>

    <!-- 绑定邮箱弹窗 -->
    <div id="bindEmailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>绑定邮箱</h3>
            </div>

            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" id="bindEmailAddress" placeholder="请输入邮箱">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" id="bindEmailPassword" placeholder="设置此邮箱的登录密码">
            </div>

            <div class="modal-footer">
                <button class="btn" onclick="closeModal('bindEmailModal')">取消</button>
                <button class="btn btn-primary" onclick="handleBindEmail()">确认绑定</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        let smsCountdown = 0;

        // 页面加载时获取账号信息
        window.onload = () => {
            if (!token) {
                window.location.href = '/';
                return;
            }
            loadAccounts();
        };

        // 加载账号信息
        async function loadAccounts() {
            try {
                const response = await fetch('/api/auth/accounts', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                const result = await response.json();

                if (result.success) {
                    updateAccountDisplay(result.data.accounts);
                } else {
                    showMessage('error', '加载账号信息失败');
                }
            } catch (error) {
                console.error('加载账号错误:', error);
                showMessage('error', '网络错误，请刷新重试');
            }
        }

        // 更新账号显示
        function updateAccountDisplay(accounts) {
            // 重置所有账号显示
            const types = ['phone', 'email', 'wechat_h5', 'wechat_mini'];
            types.forEach(type => {
                updateSingleAccount(type, null);
            });

            // 更新已绑定的账号
            accounts.forEach(account => {
                updateSingleAccount(account.auth_type, account.auth_identifier);
            });
        }

        // 更新单个账号显示
        function updateSingleAccount(type, identifier) {
            const typeMap = {
                'phone': 'phone',
                'email': 'email',
                'wechat_h5': 'wechatH5',
                'wechat_mini': 'wechatMini'
            };

            const id = typeMap[type];
            if (!id) return;

            const valueEl = document.getElementById(`${id}Value`);
            const statusEl = document.getElementById(`${id}Status`);
            const bindBtn = document.getElementById(`${id}BindBtn`);
            const unbindBtn = document.getElementById(`${id}UnbindBtn`);
            const accountItem = document.getElementById(`${id}Account`);

            if (identifier) {
                // 已绑定
                valueEl.textContent = maskSensitive(identifier, type);
                statusEl.textContent = '已绑定';
                statusEl.className = 'account-status status-linked';
                bindBtn.style.display = 'none';
                unbindBtn.style.display = 'inline-block';
                accountItem.classList.add('linked');
            } else {
                // 未绑定
                valueEl.textContent = '未绑定';
                statusEl.textContent = '未绑定';
                statusEl.className = 'account-status status-unlinked';
                bindBtn.style.display = 'inline-block';
                unbindBtn.style.display = 'none';
                accountItem.classList.remove('linked');
            }
        }

        // 脱敏显示
        function maskSensitive(value, type) {
            if (type === 'phone') {
                return value.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
            } else if (type === 'email') {
                const [name, domain] = value.split('@');
                if (name.length > 3) {
                    return name.substring(0, 3) + '***@' + domain;
                }
                return value;
            }
            return value;
        }

        // 显示绑定手机号弹窗
        function showBindPhoneModal() {
            document.getElementById('bindPhoneModal').classList.add('active');
        }

        // 显示绑定邮箱弹窗
        function showBindEmailModal() {
            document.getElementById('bindEmailModal').classList.add('active');
        }

        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 发送绑定手机验证码
        async function sendBindSMS() {
            const phoneNumber = document.getElementById('bindPhoneNumber').value.trim();

            if (!phoneNumber) {
                showMessage('error', '请输入手机号');
                return;
            }

            const btn = document.getElementById('bindPhoneSendBtn');
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/sms/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone_number: phoneNumber, purpose: 'bind' })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('success', '验证码已发送');
                    startCountdown(btn);
                } else {
                    showMessage('error', result.message || '发送失败');
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('发送验证码错误:', error);
                showMessage('error', '网络错误');
                btn.disabled = false;
            }
        }

        // 倒计时
        function startCountdown(btn) {
            smsCountdown = 60;
            updateCountdown(btn);
        }

        function updateCountdown(btn) {
            if (smsCountdown > 0) {
                btn.textContent = `${smsCountdown}秒后重发`;
                smsCountdown--;
                setTimeout(() => updateCountdown(btn), 1000);
            } else {
                btn.textContent = '发送验证码';
                btn.disabled = false;
            }
        }

        // 绑定手机号
        async function handleBindPhone() {
            const phoneNumber = document.getElementById('bindPhoneNumber').value.trim();
            const code = document.getElementById('bindPhoneCode').value.trim();

            if (!phoneNumber || !code) {
                showMessage('error', '请填写手机号和验证码');
                return;
            }

            try {
                const response = await fetch('/api/auth/bind/phone', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ phone_number: phoneNumber, code })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('success', '绑定成功');
                    closeModal('bindPhoneModal');
                    loadAccounts();
                } else {
                    showMessage('error', result.message || '绑定失败');
                }
            } catch (error) {
                console.error('绑定手机号错误:', error);
                showMessage('error', '网络错误');
            }
        }

        // 绑定邮箱
        async function handleBindEmail() {
            const email = document.getElementById('bindEmailAddress').value.trim();
            const password = document.getElementById('bindEmailPassword').value;

            if (!email || !password) {
                showMessage('error', '请填写邮箱和密码');
                return;
            }

            try {
                const response = await fetch('/api/auth/bind/email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('success', '绑定成功');
                    closeModal('bindEmailModal');
                    loadAccounts();
                } else {
                    showMessage('error', result.message || '绑定失败');
                }
            } catch (error) {
                console.error('绑定邮箱错误:', error);
                showMessage('error', '网络错误');
            }
        }

        // 解绑账号
        async function unbindAccount(authType) {
            if (!confirm(`确定要解绑此账号吗？请确保您还有其他登录方式。`)) {
                return;
            }

            try {
                const response = await fetch('/api/auth/unbind', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ auth_type: authType })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('success', '解绑成功');
                    loadAccounts();
                } else {
                    showMessage('error', result.message || '解绑失败');
                }
            } catch (error) {
                console.error('解绑错误:', error);
                showMessage('error', '网络错误');
            }
        }

        // 绑定微信H5
        function bindWeChatH5() {
            showMessage('error', '微信H5登录需要配置微信公众号，请联系管理员');
        }

        // 绑定微信小程序
        function bindWeChatMini() {
            showMessage('error', '微信小程序登录需要在小程序中使用');
        }

        // 显示消息
        function showMessage(type, text) {
            const messageBox = document.getElementById('messageBox');
            messageBox.className = `message ${type} show`;
            messageBox.textContent = text;

            // 3秒后自动隐藏
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
