<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长端 - AI陪伴学习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #f5576c;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn {
            padding: 12px 30px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: #f5576c;
            color: white;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .insight-box {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .insight-box h3 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        .recommendation {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .privacy-note {
            background: #fef2f2;
            border: 2px dashed #ef4444;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .privacy-note strong {
            color: #dc2626;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍👩‍👧 家长端仪表板</h1>
            <p>了解孩子的学习进展 · 隐私安全 · 仅汇总数据</p>
        </div>

        <!-- 登录 -->
        <div id="loginSection" class="card">
            <h2>查看学习报告</h2>
            <input type="text" id="studentId" placeholder="请输入学生ID">
            <button class="btn" onclick="loadParentDashboard()">查看报告</button>
        </div>

        <!-- 仪表板 -->
        <div id="dashboardSection" class="hidden">
            <!-- 隐私提示 -->
            <div class="privacy-note">
                <strong>🔒 隐私保护承诺</strong><br>
                您看到的是汇总数据和趋势分析，不包含实时监控。<br>
                我们尊重孩子的学习隐私，提供洞察而非监视。
            </div>

            <!-- 统计卡片 -->
            <div class="card">
                <h2>📊 本周学习概览</h2>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <!-- AI洞察 -->
            <div class="card">
                <h2>💡 AI生成的洞察</h2>
                <div id="aiInsights"></div>
            </div>

            <!-- 学科进度 -->
            <div class="card">
                <h2>📚 学科掌握度</h2>
                <div id="subjectProgress"></div>
            </div>

            <!-- 建议 -->
            <div class="card">
                <h2>✨ 给家长的建议</h2>
                <div id="recommendations"></div>
            </div>

            <button class="btn" onclick="location.reload()">返回</button>
        </div>
    </div>

    <script>
        async function loadParentDashboard() {
            const studentId = document.getElementById('studentId').value.trim();

            if (!studentId) {
                alert('请输入学生ID');
                return;
            }

            try {
                const response = await fetch(`/api/dashboard/parent/${studentId}`);
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    displayDashboard(data);
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                } else {
                    alert('加载失败');
                }
            } catch (error) {
                console.error('错误:', error);
                alert('连接服务器失败，请确保后端服务正在运行');
            }
        }

        function displayDashboard(data) {
            // 统计卡片
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="label">本周学习时间</div>
                    <div class="value">${Math.floor(data.week_total_time / 60) || 0} 分钟</div>
                </div>
                <div class="stat-card">
                    <div class="label">日均学习时间</div>
                    <div class="value">${Math.floor(data.week_average_daily / 60) || 0} 分钟</div>
                </div>
                <div class="stat-card">
                    <div class="label">生产力评分</div>
                    <div class="value">${Math.round((data.productivity_score || 0) * 100)}%</div>
                </div>
                <div class="stat-card">
                    <div class="label">参与度</div>
                    <div class="value">${data.engagement_level || '中等'}</div>
                </div>
            `;

            // AI洞察
            const insights = document.getElementById('aiInsights');
            insights.innerHTML = `
                <div class="insight-box">
                    <h3>本周总结</h3>
                    <p>${data.weekly_summary || '暂无数据'}</p>
                </div>
            `;

            // 学科进度
            const subjects = document.getElementById('subjectProgress');
            let subjectHTML = '';
            if (data.subjects_progress && Object.keys(data.subjects_progress).length > 0) {
                for (const [subject, mastery] of Object.entries(data.subjects_progress)) {
                    const percentage = Math.round(mastery * 100);
                    subjectHTML += `
                        <div style="margin: 15px 0;">
                            <div style="display: flex; justify-between; margin-bottom: 5px;">
                                <span><strong>${subject}</strong></span>
                                <span>${percentage}%</span>
                            </div>
                            <div style="background: #e0e0e0; height: 10px; border-radius: 5px;">
                                <div style="background: #667eea; height: 100%; width: ${percentage}%; border-radius: 5px;"></div>
                            </div>
                        </div>
                    `;
                }
            } else {
                subjectHTML = '<p>暂无学科数据</p>';
            }
            subjects.innerHTML = subjectHTML;

            // 建议
            const recommendations = document.getElementById('recommendations');
            let recHTML = '';
            if (data.recommendations_for_parent && data.recommendations_for_parent.length > 0) {
                data.recommendations_for_parent.forEach(rec => {
                    recHTML += `
                        <div class="recommendation">
                            <p>✓ ${rec}</p>
                        </div>
                    `;
                });
            } else {
                recHTML = '<div class="recommendation"><p>✓ 孩子学习状态良好，请继续保持支持和鼓励！</p></div>';
            }
            recommendations.innerHTML = recHTML;
        }
    </script>
</body>
</html>
